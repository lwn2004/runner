name: Temporary route map formatter
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/format-route-map-temp.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@8.9.0 --activate
      - run: pnpm install
      - name: Print Prettier output
        run: pnpm exec prettier src/components/RouteMapCanvas.tsx
