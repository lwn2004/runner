name: Format feature branch

on:
  push:
    branches:
      - feature/ai-review-and-prediction

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-review-and-prediction
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/components/AIReviewPage.tsx src/components/Header.tsx src/components/PredictionPage.tsx src/themes/dashboard/index.tsx
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
      - name: Commit formatted files and remove temporary workflow
        run: |
          rm .github/workflows/format-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format and verify Tanda prediction chart"
          git push
