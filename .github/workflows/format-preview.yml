name: Temporary Prettier Preview

on:
  push:
    branches:
      - mobile-home-homepage-layout

jobs:
  prettier_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm exec prettier src/components/ActivityLog.tsx
